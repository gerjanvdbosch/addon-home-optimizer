[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "addon-home-optimizer"
version = "0.1.dev0"
description = "Smart heat pump control based on thermal behavior, solar, and energy prices."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "gerjanvdbosch" },
]
dependencies = [
    "plotly>=5.20",
    "pandas>=2.2",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.7",
    "pyomo>=6.8",
    "highspy>=1.8",
    "skforecast>=0.23",
    "optuna>=4.8",
    "influxdb>=5.3",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "tqdm>=4.70",
    "scipy>=1.13",
    "pvlib>=0.11",
]

[project.optional-dependencies]
dev = [
    "pyflakes>=3.2",
    "pyright>=1.1,<2.0",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.4",
    "import-linter>=2.0",
]

[project.scripts]
web = "web:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The suite is dominated by least-squares fits on synthetic data, which are
# independent of each other and CPU-bound. Add "-n0" to a command to run a
# single test serially - spawning workers costs more than it saves there.
addopts = ["-n", "auto"]

[tool.importlinter]
root_packages = ["domain", "infrastructure", "features", "app", "web"]

# The architecture as a check rather than a convention: each layer may only
# reach downwards. domain sits at the bottom and imports nothing of ours, so
# the balances, the constants and the models stay usable by the identifiers
# that fit them, the filter that estimates their states and the planner that
# acts on them alike.
[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = ["web", "app", "features", "infrastructure", "domain"]

# domain must not learn about the database, the web or the workflow: it is
# physics and data shapes, and the one dependency that broke this (the dataset
# vocabulary living in the InfluxDB adapter) now points the other way.
[[tool.importlinter.contracts]]
name = "Domain knows nothing of the rest"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["infrastructure", "features", "app", "web"]

# A model says what data it needs in domain/dataset.py terms; which database
# that comes out of is the composition root's choice, injected as a list of
# DataLoader. So no feature may name a concrete adapter - if this breaks, an
# identifier has started depending on InfluxDB instead of on its own inputs.
[[tool.importlinter.contracts]]
name = "Features stay off infrastructure"
type = "forbidden"
source_modules = ["features"]
forbidden_modules = ["infrastructure"]
