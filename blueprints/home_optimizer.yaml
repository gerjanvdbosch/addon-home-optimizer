blueprint:
  name: Home Optimizer
  description: Runs the Home Optimizer plan
  domain: automation
  source_url: https://github.com/gerjanvdbosch/addon-home-optimizer/blob/main/blueprints/home_optimizer.yaml
  input:
    optimizer:
      name: Optimizer enabled
      selector:
        entity:
          domain: input_boolean
    dhw_switch:
      name: DHW block switch (off at DHW start, on again after)
      selector:
        entity:
          domain: switch
    heat_pump_state:
      name: Heat pump operating state
      selector:
        entity:
          domain: sensor
    living_climate:
      name: Living room thermostat
      selector:
        entity:
          domain: climate
    rest_climates:
      name: Rest thermostats (bathroom and bedrooms)
      default: [ ]
      selector:
        entity:
          domain: climate
          multiple: true
    bias_number:
      name: Auto-adaptive setpoint bias (optional)
      description: >-
        The esphome-ecodan-hp bias number, set to sensor.home_optimizer_zone_bias
        (needs heat_pump.auto_adaptive on in the optimizer config). Empty leaves
        the bias alone.
      default: ""
      selector:
        entity:
          domain: number
    calibrate_time:
      name: Nightly calibration time
      description: When the models are calibrated.
      default: "02:00:00"
      selector:
        time:
    calibrate_days:
      name: Calibration history (days)
      description: How many past days the nightly calibration fits the models on.
      default: 365
      selector:
        number:
          min: 30
          max: 365
          step: 1
          unit_of_measurement: days
          mode: box
    notify_devices:
      name: Notify devices (optional)
      description: >-
        Phones (Companion app) that get runs and warnings. None sends nothing.
      default: [ ]
      selector:
        device:
          integration: mobile_app
          multiple: true
    dry_run:
      name: Dry run
      description: >-
        Only notifies what the plan would do: switches, thermostats and the
        bias are left alone, and the watchdogs are off.
      default: false
      selector:
        boolean:

variables:
  living: !input living_climate
  rest: !input rest_climates
  bias_number: !input bias_number
  calibrate_days: !input calibrate_days
  notify_devices: !input notify_devices
  dry_run: !input dry_run
  dhw_switch: !input dhw_switch
  heat_pump: !input heat_pump_state

triggers:
  - trigger: state
    entity_id: binary_sensor.home_optimizer_dhw_status
    from: "off"
    to: "on"
    id: dhw_start
  # The heat pump out of DHW for 10 minutes, so a started run is never cut off:
  # a defrost keeps the state on DHW, the 10 minutes ride out a flicker, and a
  # sensor gone unavailable is no end. "SWW" is the add-on's heat_pump mode
  # dhw default.
  - trigger: state
    entity_id: !input heat_pump_state
    from: SWW
    not_to: [ SWW, unknown, unavailable ]
    for: { minutes: 10 }
    id: dhw_end
  # Dry run: the heat pump does its own hot water, so the plan's end is told.
  - trigger: state
    entity_id: binary_sensor.home_optimizer_dhw_status
    from: "on"
    to: "off"
    id: dhw_plan_end
  - trigger: state
    entity_id: binary_sensor.home_optimizer_zone_status
    from: "off"
    to: "on"
    id: zone_start
  - trigger: state
    entity_id: binary_sensor.home_optimizer_zone_status
    from: "on"
    to: "off"
    for: { minutes: 10 }
    id: zone_stop
  - trigger: state
    entity_id: sensor.home_optimizer_zone_setpoint
    not_to: [ unknown, unavailable ]
    id: zone_setpoint
  - trigger: state
    entity_id: sensor.home_optimizer_zone_rest_setpoint
    not_to: [ unknown, unavailable ]
    id: rest
  - trigger: state
    entity_id: sensor.home_optimizer_zone_bias
    not_to: [ unknown, unavailable ]
    id: zone_bias
  - trigger: time_pattern
    minutes: /5
    id: plan
  - trigger: time
    at: !input calibrate_time
    id: calibrate
  # Watchdog: a run planned for a quarter of an hour that the heat pump is not
  # doing. "Uit" and "SWW" are the add-on's heat_pump.states defaults.
  - trigger: state
    entity_id: binary_sensor.home_optimizer_zone_status
    to: "on"
    for: { minutes: 15 }
    id: zone_watchdog
  - trigger: state
    entity_id: binary_sensor.home_optimizer_dhw_status
    to: "on"
    for: { minutes: 15 }
    id: dhw_watchdog

conditions:
  - condition: state
    entity_id: !input optimizer
    state: "on"

actions:
  - choose:
      - alias: DHW start
        conditions:
          - condition: trigger
            id: dhw_start
          - condition: state
            entity_id: binary_sensor.home_optimizer_dhw_status
            state: "on"
          - condition: template
            value_template: "{{ dry_run or is_state(dhw_switch, 'on') }}"
        sequence:
          - variables:
              message: >-
                Optimizer DHW start, to
                {{ states('sensor.home_optimizer_dhw_setpoint') }} °C
          # Sent only with notify devices chosen.
          - &notify
            repeat:
              for_each: "{{ notify_devices }}"
              sequence:
                - action: >-
                    notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                  data:
                    message: "{{ ('[dry run] ' if dry_run else '') ~ message }}"
          - &control
            condition: template
            value_template: "{{ not dry_run }}"
          - action: switch.turn_off
            target:
              entity_id: !input dhw_switch
      - alias: DHW end
        conditions:
          - condition: template
            value_template: >-
              {{ (dry_run and trigger.id == 'dhw_plan_end')
                 or (not dry_run and trigger.id == 'dhw_end'
                     and is_state(dhw_switch, 'off')) }}
        sequence:
          - variables:
              message: >-
                Optimizer DHW end, tank
                {{ states('sensor.home_optimizer_dhw_soc') }} %
          - *notify
          - *control
          - action: switch.turn_on
            target:
              entity_id: !input dhw_switch
      - alias: Zone start
        conditions:
          - condition: trigger
            id: zone_start
          - condition: state
            entity_id: binary_sensor.home_optimizer_zone_status
            state: "on"
          - condition: template
            value_template: "{{ has_value('sensor.home_optimizer_zone_setpoint') }}"
        sequence:
          - variables:
              message: >-
                Optimizer zone start, living room
                {{ states('sensor.home_optimizer_zone_setpoint') }} °C{{
                  ', rest ' ~ states('sensor.home_optimizer_zone_rest_setpoint') ~ ' °C'
                  if has_value('sensor.home_optimizer_zone_rest_setpoint') }}
          - *notify
          - *control
          # The thermostat calls for heat only above the room: left at a lower
          # setpoint the run never starts (6 Nov 2026: 15 degC, 40 min late).
          # Handed over from hot water the zone is on in the tank's last
          # quarter hour already, so the heat pump goes on to the floor.
          - action: climate.set_temperature
            target:
              entity_id: !input living_climate
            data:
              temperature: "{{ states('sensor.home_optimizer_zone_setpoint') | float }}"
      - alias: Rest
        conditions:
          - condition: trigger
            id: rest
          - *control
          - condition: template
            value_template: >-
              {{ rest | count > 0
                 and has_value('sensor.home_optimizer_zone_rest_setpoint') }}
        sequence:
          - &rest
            action: climate.set_temperature
            target:
              entity_id: !input rest_climates
            data:
              temperature: "{{ states('sensor.home_optimizer_zone_rest_setpoint') | float }}"
      - alias: Zone stop
        conditions:
          - condition: trigger
            id: zone_stop
          - condition: state
            entity_id: binary_sensor.home_optimizer_zone_status
            state: "off"
        sequence:
          - variables:
              message: >-
                Optimizer zone stop, living room
                {{ state_attr(living, 'current_temperature') }} °C
          - *notify
          - *control
          - if:
              - condition: template
                value_template: >-
                  {{ rest | count > 0
                     and has_value('sensor.home_optimizer_zone_rest_setpoint') }}
            then:
              - *rest
      - alias: Zone setpoint
        conditions:
          - condition: trigger
            id: zone_setpoint
          - *control
        sequence:
          - choose:
              # Within a run only up: the plan raises it as the run goes on,
              # and a thermostat left at the start's setpoint ends the run once
              # the room reaches it
              # (6 Nov 2026: 19.1 at the start, 20.3 later).
              - conditions:
                  - condition: state
                    entity_id: binary_sensor.home_optimizer_zone_status
                    state: "on"
                  - condition: template
                    value_template: >-
                      {{ states('sensor.home_optimizer_zone_setpoint') | float(0)
                         > state_attr(living, 'temperature') | float(99) }}
                sequence: &living
                  - action: climate.set_temperature
                    target:
                      entity_id: !input living_climate
                    data:
                      temperature: "{{ states('sensor.home_optimizer_zone_setpoint') | float }}"
              # Between runs the comfort band's edge: the thermostat asks for
              # heat only where the room passed what the plan allows - left at
              # the run's setpoint the heat pump ran on 20-75 minutes past the
              # plan's end (3-5 Nov 2026).
              - conditions:
                  - condition: state
                    entity_id: binary_sensor.home_optimizer_zone_status
                    state: "off"
                sequence: *living
      - alias: Zone bias
        conditions:
          - condition: trigger
            id: zone_bias
          - *control
          - condition: template
            value_template: "{{ bias_number != '' }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: "{{ bias_number }}"
            data:
              value: "{{ states('sensor.home_optimizer_zone_bias') | float(0) }}"
      # The add-on runs its jobs one at a time in the order they come, so the
      # plan is made from the state just updated.
      - alias: Plan
        conditions:
          - condition: trigger
            id: plan
        sequence:
          - action: rest_command.home_optimizer_api
            data:
              endpoint: update
              payload: |
                {{ {} | to_json }}
            response_variable: update
            continue_on_error: true
          - if:
              - condition: template
                value_template: "{{ update is defined and update.status == 200 }}"
            then:
              - action: rest_command.home_optimizer_api
                data:
                  endpoint: optimize
                  payload: |
                    {{ {} | to_json }}
            # Watchdog: the add-on unreachable, told at most once an hour.
            else:
              - condition: template
                value_template: "{{ now().minute < 5 }}"
              - variables:
                  message: >-
                    Optimizer warning: the add-on does not answer
                    ({{ update.status if update is defined else 'no response' }})
              - *notify
      - alias: Calibrate
        conditions:
          - condition: trigger
            id: calibrate
        sequence:
          - action: rest_command.home_optimizer_api
            data:
              endpoint: calibrate
              payload: |
                {{ {
                  "days": calibrate_days | int
                } | to_json }}
      - alias: Zone watchdog
        conditions:
          - condition: trigger
            id: zone_watchdog
          - *control
          - condition: state
            entity_id: binary_sensor.home_optimizer_zone_status
            state: "on"
          - condition: state
            entity_id: !input heat_pump_state
            state: Uit
        sequence:
          - variables:
              message: >-
                Optimizer warning: zone run planned for 15 minutes but the heat
                pump is off (thermostat {{ state_attr(living, 'temperature') }} °C,
                room {{ state_attr(living, 'current_temperature') }} °C)
          - *notify
      - alias: DHW watchdog
        conditions:
          - condition: trigger
            id: dhw_watchdog
          - *control
          - condition: state
            entity_id: binary_sensor.home_optimizer_dhw_status
            state: "on"
          - condition: template
            value_template: "{{ has_value(heat_pump) and states(heat_pump) != 'SWW' }}"
        sequence:
          - variables:
              message: >-
                Optimizer warning: hot water planned for 15 minutes but the heat
                pump is {{ states(heat_pump) }}
          - *notify

# Queued: a bias change may come with a start.
mode: queued
