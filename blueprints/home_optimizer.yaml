blueprint:
  name: Home Optimizer
  description: >-
    Runs the Home Optimizer plan: starts DHW on schedule, blocks it again once
    the heat pump has left DHW, and sets the living room thermostat to
    sensor.home_optimizer_zone_setpoint - a run's setpoint
    while the zone is on (from the tank's last quarter hour when heating
    follows, so the heat pump goes straight on to the floor), the comfort
    band's edge between runs. The rest (bathroom and bedrooms) gets that
    setpoint's attribute "rest" - the rest's minimum while a run is served,
    so a room below it heats along and one above it does not, the idle
    setpoint from the optimizer config otherwise.
  domain: automation
  source_url: https://github.com/gerjanvdbosch/addon-home-optimizer/blob/main/blueprints/home_optimizer.yaml
  input:
    optimizer:
      name: Optimizer enabled
      selector:
        entity:
          domain: input_boolean
    dhw_switch:
      name: DHW block switch (off at DHW start, on again after)
      selector:
        entity:
          domain: switch
    heat_pump_state:
      name: Heat pump operating state
      selector:
        entity:
          domain: sensor
    dhw_state:
      name: Operating state while in DHW
      default: SWW
      selector:
        text: { }
    zone_after:
      name: Zone not before
      default: "08:00:00"
      selector: { time: { } }
    zone_before:
      name: Zone not after
      default: "20:00:00"
      selector: { time: { } }
    living_climate:
      name: Living room thermostat
      selector:
        entity:
          domain: climate
    rest_climates:
      name: Rest thermostats (bathroom and bedrooms)
      default: [ ]
      selector:
        entity:
          domain: climate
          multiple: true
    bias_number:
      name: Auto-adaptive setpoint bias (optional)
      description: >-
        The esphome-ecodan-hp bias number, set to sensor.home_optimizer_zone_bias
        (needs heat_pump.auto_adaptive on in the optimizer config). Empty leaves
        the bias alone.
      default: ""
      selector:
        entity:
          domain: number

variables:
  living: !input living_climate
  rest: !input rest_climates
  bias_number: !input bias_number

triggers:
  - trigger: state
    entity_id: binary_sensor.home_optimizer_dhw_status
    from: "off"
    to: "on"
    id: dhw_start
  # The heat pump out of DHW for 10 minutes, so a started run is never cut off:
  # a defrost keeps the state on DHW, the 10 minutes ride out a flicker, and a
  # sensor gone unavailable is no end.
  - trigger: state
    entity_id: !input heat_pump_state
    from: !input dhw_state
    not_to: [ !input dhw_state, unknown, unavailable ]
    for: { minutes: 10 }
    id: dhw_end
  - trigger: state
    entity_id: binary_sensor.home_optimizer_zone_status
    from: "off"
    to: "on"
    id: zone_start
  - trigger: state
    entity_id: binary_sensor.home_optimizer_zone_status
    from: "on"
    to: "off"
    for: { minutes: 10 }
    id: zone_stop
  - trigger: state
    entity_id: sensor.home_optimizer_zone_setpoint
    not_to: [ unknown, unavailable ]
    id: zone_setpoint
  - trigger: state
    entity_id: sensor.home_optimizer_zone_setpoint
    attribute: rest
    id: rest
  - trigger: state
    entity_id: sensor.home_optimizer_zone_bias
    not_to: [ unknown, unavailable ]
    id: zone_bias

conditions:
  - condition: state
    entity_id: !input optimizer
    state: "on"

actions:
  - choose:
      - alias: DHW start
        conditions:
          - condition: trigger
            id: dhw_start
          - condition: state
            entity_id: binary_sensor.home_optimizer_dhw_status
            state: "on"
          - condition: state
            entity_id: !input dhw_switch
            state: "on"
        sequence:
          - action: notify.notify
            data:
              message: Optimizer DHW start
          - action: switch.turn_off
            target:
              entity_id: !input dhw_switch
      - alias: DHW end
        conditions:
          - condition: trigger
            id: dhw_end
          - condition: state
            entity_id: !input dhw_switch
            state: "off"
        sequence:
          - action: notify.notify
            data:
              message: Optimizer DHW end
          - action: switch.turn_on
            target:
              entity_id: !input dhw_switch
      - alias: Zone start
        conditions:
          - condition: trigger
            id: zone_start
          - condition: state
            entity_id: binary_sensor.home_optimizer_zone_status
            state: "on"
          - condition: time
            after: !input zone_after
            before: !input zone_before
          - condition: template
            value_template: "{{ has_value('sensor.home_optimizer_zone_setpoint') }}"
        sequence:
          - action: notify.notify
            data:
              message: >-
                Optimizer zone start, living room
                {{ states('sensor.home_optimizer_zone_setpoint') }} °C
          # The thermostat calls for heat only above the room: left at a lower
          # setpoint the run never starts (6 Nov 2026: 15 degC, 40 min late).
          # Handed over from hot water the zone is on in the tank's last
          # quarter hour already, so the heat pump goes on to the floor.
          - action: climate.set_temperature
            target:
              entity_id: !input living_climate
            data:
              temperature: "{{ states('sensor.home_optimizer_zone_setpoint') | float }}"
      - alias: Rest
        conditions:
          - condition: trigger
            id: rest
          - condition: template
            value_template: >-
              {{ rest | count > 0
                 and state_attr('sensor.home_optimizer_zone_setpoint', 'rest') is number }}
          # Up only in the hours a run may start, as the living room: a rest
          # room below its setpoint starts the heat pump too. Down always.
          - or:
              - condition: time
                after: !input zone_after
                before: !input zone_before
              - condition: template
                value_template: >-
                  {{ state_attr('sensor.home_optimizer_zone_setpoint', 'rest')
                     < state_attr(rest[0], 'temperature') | float(99) }}
        sequence:
          - &rest
            action: climate.set_temperature
            target:
              entity_id: !input rest_climates
            data:
              temperature: "{{ state_attr('sensor.home_optimizer_zone_setpoint', 'rest') }}"
      - alias: Zone stop
        conditions:
          - condition: trigger
            id: zone_stop
          - condition: state
            entity_id: binary_sensor.home_optimizer_zone_status
            state: "off"
        sequence:
          - action: notify.notify
            data:
              message: Optimizer zone stop
          - if:
              - condition: template
                value_template: >-
                  {{ rest | count > 0
                     and state_attr('sensor.home_optimizer_zone_setpoint', 'rest') is number }}
            then:
              - *rest
      - alias: Zone setpoint
        conditions:
          - condition: trigger
            id: zone_setpoint
        sequence:
          - choose:
              # Within a run only up, and only in the hours a run may start:
              # the plan raises it as the run goes on, and a thermostat left
              # at the start's setpoint ends the run once the room reaches it
              # (6 Nov 2026: 19.1 at the start, 20.3 later).
              - conditions:
                  - condition: state
                    entity_id: binary_sensor.home_optimizer_zone_status
                    state: "on"
                  - condition: time
                    after: !input zone_after
                    before: !input zone_before
                  - condition: template
                    value_template: >-
                      {{ states('sensor.home_optimizer_zone_setpoint') | float(0)
                         > state_attr(living, 'temperature') | float(99) }}
                sequence: &living
                  - action: climate.set_temperature
                    target:
                      entity_id: !input living_climate
                    data:
                      temperature: "{{ states('sensor.home_optimizer_zone_setpoint') | float }}"
              # Between runs the comfort band's edge: the thermostat asks for
              # heat only where the room passed what the plan allows - left at
              # the run's setpoint the heat pump ran on 20-75 minutes past the
              # plan's end (3-5 Nov 2026).
              - conditions:
                  - condition: state
                    entity_id: binary_sensor.home_optimizer_zone_status
                    state: "off"
                sequence: *living
      - alias: Zone bias
        conditions:
          - condition: trigger
            id: zone_bias
          - condition: template
            value_template: "{{ bias_number != '' }}"
        sequence:
          - action: number.set_value
            target:
              entity_id: "{{ bias_number }}"
            data:
              value: "{{ states('sensor.home_optimizer_zone_bias') | float(0) }}"

# Queued: a bias change may come with a start.
mode: queued
