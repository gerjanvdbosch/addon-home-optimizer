name: Python lint

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python and enable pip cache
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project with dev dependencies
        run: python -m pip install -e .[dev]

      - name: Pyflakes (syntax check)
        run: pyflakes src tests

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format check)
        run: ruff format --check src tests

      #      - name: Pyright (type check)
      #        run: pyright

      # One thread per library in each test worker: pytest-xdist already runs a
      # worker per core, and BLAS or OpenMP pools inside every one of them
      # (numpy, scipy, sklearn, HiGHS) oversubscribe the runner's cores.
      - name: Pytest
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python -m pytest --durations=15
